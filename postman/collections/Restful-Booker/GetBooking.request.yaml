$kind: http-request
url: "{{baseUrl}}/booking/4"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response is a non-empty list\", function () {\r

      \    const data = pm.response.json();\r

      \    pm.expect(data).to.be.an(\"array\").that.is.not.empty;\r

      });\r

      \r

      pm.test(\"Response time under 3000ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(3000);\r

      });\r

      \r

      pm.test(\"Invalid ID returns 404\", function () {\r

      \    pm.expect(pm.response.code).to.eql(404);\r

      });\r

      \r

      pm.test(\"Firstname matches\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json.firstname).to.eql(\"Jim\");\r

      });\r

      \r

      pm.test(\"Total Price > 300\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json.totalprice).to.be.greaterThan(300);\r

      });"
    language: text/javascript
order: 1000
